<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💗</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Press Start 2P', cursive;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #ffdeeb;
      background-image: radial-gradient(#ffb6c1 2px, transparent 2px);
      background-size: 20px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #d63384;
      text-align: center;
    }
    .card {
      background: #fff0f5;
      border: 6px solid #ff69b4;
      box-shadow: 8px 8px 0px #d63384;
      padding: 25px;
      border-radius: 15px;
      max-width: 450px;
      width: 90%;
      position: relative;
    }
    img {
      width: 150px;
      height: 150px;
      border: 4px solid #ff69b4;
      border-radius: 10px;
      margin-bottom: 15px;
      object-fit: cover;
    }
    h2 {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #c71585;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    button {
      background-color: #ff69b4;
      color: white;
      border: 4px solid #c71585;
      box-shadow: 4px 4px 0px #8b008b;
      padding: 12px 18px;
      font-size: 10px;
      cursor: pointer;
      border-radius: 8px;
      transition: transform 0.1s;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #8b008b;
    }
    .btn-no {
      background-color: #ffb6c1;
      border-color: #db7093;
      box-shadow: 4px 4px 0px #c71585;
      color: #8b008b;
    }
    .sub-text {
      font-size: 9px;
      color: #db7093;
      margin-top: 10px;
      height: 15px;
    }
    .option-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
    }
    .hidden {
      display: none !important;
    }
    
    /* Modal Popup */
    .modal {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border: 4px solid #ff69b4;
      border-radius: 10px;
      font-size: 10px;
      line-height: 1.6;
      max-width: 80%;
      box-shadow: 6px 6px 0px #d63384;
    }
  </style>
</head>
<body>

<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card" onclick="playAudioOnce()">
  
  <div id="screen1">
    <img src="cat1.gif" alt="Cat GIF">
    <h2 id="title1">aya, wach 3arfa chhal kat3ajbini wkanbrik a bb💗?</h2>
    <div class="btn-container">
      <button id="btnYes" onclick="goToScreen(2)">IYEH 3ARFA</button>
      <button id="btnNo" class="btn-no" onclick="handleNo()">LA MA3ARFACH</button>
    </div>
    <div id="noSubText" class="sub-text"></div>
  </div>

  <div id="screen2" class="hidden">
    <img src="cat2.gif" alt="Cat GIF">
    <h2>YAY! Wa khassak tkon 3arfa!</h2>
    <button onclick="goToScreen(3)">KLIKEY HNA BASH TKEMLI</button>
  </div>

  <div id="screen3" class="hidden">
    <img src="cat3.gif" alt="Cat GIF">
    <h2>chno aktar haja kat3ajbak fiya ?</h2>
    <button class="option-btn" onclick="selectOption1('soti')">soti</button>
    <button class="option-btn" onclick="selectOption1('el hanan dyali Lik')">el hanan dyali Lik</button>
    <button class="option-btn" onclick="selectOption1('Kolchi')">Kolchi</button>
  </div>

  <div id="screen4" class="hidden">
    <img src="cat4.gif" alt="Cat GIF">
    <h2>chhal kadni ana kanbriiiiiiiik💗</h2>
    <button class="option-btn" onclick="checkQuiz('wrong')">100%</button>
    <button class="option-btn" onclick="checkQuiz('wrong')">200%</button>
    <button class="option-btn" onclick="checkQuiz('wrong')">1000%</button>
    <button class="option-btn" onclick="checkQuiz('wrong')">∞</button>
    <button class="option-btn" onclick="checkQuiz('correct')">∞×∞</button>
  </div>

  <div id="screen5" class="hidden">
    <img src="cat5.gif" alt="Cat GIF">
    <h2>AKTAAR HJA KANBHIK!!!</h2>
    <p id="summaryText" style="font-size: 9px; color: #c71585; margin: 15px 0;"></p>
    <button onclick="openNote()">💌 1 NEW MESSAGE</button>
  </div>

  <div id="noteModal" class="modal hidden">
    <div class="modal-content">
      <p>Nti a7san 7aja wa93at liya f 7ayati.. Kat3jbini w kanbrik bzaaaaaaaaaaf a bb💗!</p>
      <button onclick="closeNote()" style="margin-top: 15px;">Close x</button>
    </div>
  </div>

</div>

<script>
  let audioStarted = false;
  function playAudioOnce() {
    if (!audioStarted) {
      const audio = document.getElementById('bgMusic');
      audio.play().catch(e => console.log("Audio play blocked"));
      audioStarted = true;
    }
  }

  let noCount = 0;
  const noMessages = [
    "Nari ma3arfach?!",
    "Men niyatk?",
    "Kanjm3 lik 9loba hna <3",
    "Rah kanbrik bzaaaaf!",
    "Ghadia tbkini...",
    "9albi t3sar <3"
  ];

  let selectedOption1 = "";

  function handleNo() {
    playAudioOnce();
    const btnYes = document.getElementById('btnYes');
    const subText = document.getElementById('noSubText');
    
    let currentSize = parseFloat(window.getComputedStyle(btnYes).fontSize);
    btnYes.style.fontSize = (currentSize + 4) + 'px';
    btnYes.style.padding = (currentSize + 2) + 'px';

    subText.innerText = noMessages[noCount % noMessages.length];
    noCount++;
